# The iOS text-input probe: gpui-base's single-line Input under gpui_ios, so the
# UIKit text contract can be driven by the system keyboard on a simulator
# (Maestro flows in the wasm-mobile briefs, lanes/P). Standalone package; the
# fork is a crate, not a workspace, so its crates are patched by path.
[package]
name = "gpui_base_ios_input"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "gpui_base_ios_input"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_os = "ios")'.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_base = { package = "gpui-base", path = "../.." }
gpui_ios = { package = "gpui-pre-ios", path = "../../../gpui-pre-ios" }

[patch.crates-io]
gpui-pre = { path = "../../../.." }
gpui-pre-scheduler = { path = "../../../gpui-pre-scheduler" }
